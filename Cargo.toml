[package]
name = "matching-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
aeron-wrapper = { path = "../aeron-wrapper" }
tracing = "0.1"
rand = "0.8"
crossbeam = "0.8"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
hdrhistogram = "7"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = false
debug = false
overflow-checks = false

[profile.bench]
inherits = "release"

[[bench]]
name = "matching_bench"
harness = false
