[package]
name = "lightning-exchange"
version = "0.1.0"
edition = "2021"

[dependencies]
aeron-wrapper = { path = "../aeron-wrapper" }
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.8"
rtrb = "0.3"
parking_lot = "0.12"
ordered-float = "5.3.0"
smallvec = "1.13"
libc = "0.2"
static_assertions = "1.1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors"] }
futures = "0.3"
futures-util = "0.3"
tokio-tungstenite = "0.21"
uuid = { version = "1", features = ["v4"] }

# Storage & auth
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-native-tls", "chrono", "macros"] }
redis = { version = "0.27", features = ["tokio-comp"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
bcrypt = "0.15"
thiserror = "1"
anyhow = "1"
dashmap = "6"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
hdrhistogram = "7"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = false
debug = false
overflow-checks = false

[profile.bench]
inherits = "release"

[[bench]]
name = "matching_bench"
harness = false
[[bin]]
name = "exchange-server"
path = "src/main.rs"

[[bin]]
name = "desk-server"
path = "src/bin/desk_server.rs"
