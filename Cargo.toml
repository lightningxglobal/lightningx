[package]
name = "lightning-exchange"
version = "0.1.0"
edition = "2021"

[dependencies]
aeron-wrapper = { path = "../aeron-wrapper" }
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.8"
rtrb = "0.3"
parking_lot = "0.12"
ordered-float = "5.3.0"
smallvec = "1.13"
libc = "0.2"
static_assertions = "1.1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors"] }
tower-service = "0.3"
futures = "0.3"
futures-util = "0.3"
fastwebsockets = { version = "0.8", features = ["upgrade", "unstable-split"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "server-auto", "server-graceful"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", features = ["ring"] }
rustls-native-certs = "0.7"
uuid = { version = "1", features = ["v4"] }

# Storage & auth
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "chrono", "macros"] }
redis = { version = "0.27", features = ["tokio-comp"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
bcrypt = "0.15"
thiserror = "1"
anyhow = "1"
dashmap = "6"
arc-swap = "1"
crossbeam-queue = "0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
hdrhistogram = "7"
serial_test = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = false
debug = false
overflow-checks = false

[profile.bench]
inherits = "release"

[[bench]]
name = "matching_bench"
harness = false
[[bin]]
name = "exchange-server"
path = "src/main.rs"

[[bin]]
name = "desk-server"
path = "src/bin/desk_server.rs"

[[bin]]
name = "lightning-data"
path = "src/bin/data_server.rs"

[[bin]]
name = "market-maker"
path = "src/bin/market_maker.rs"

[[bin]]
name = "trade-bot"
path = "src/bin/trade_bot.rs"

[[bin]]
name = "kline-service"
path = "src/bin/kline_service.rs"

[[bin]]
name = "exchange-engine"
path = "src/bin/exchange_engine.rs"

[[bin]]
name = "redis-writer"
path = "src/bin/redis_writer.rs"

[[bin]]
name = "pg-writer"
path = "src/bin/pg_writer.rs"

[[bin]]
name = "pressure-client"
path = "src/bin/pressure_client.rs"

[target.'cfg(target_os = "linux")'.dependencies]
tokio-uring = { version = "0.5" }
